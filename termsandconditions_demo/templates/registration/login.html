{% extends "base.html" %}

{% block headtitle %}Sign In{% endblock %}

{% block content %}
    <section aria-label="Sign in">
        <h1>Sign In</h1>
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <p><button type="submit">Log in</button></p>
        </form>
    </section>
{% endblock %}
