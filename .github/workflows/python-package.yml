# Lints and tests the package across the supported Python and Django versions.
# See: https://docs.github.com/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          cache-dependency-glob: "uv.lock"
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Check for missing migrations
        run: uv run --no-sync python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
        django-version: [ '5.2', '6.1' ]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          cache-dependency-glob: "uv.lock"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Override Django version
        run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - name: Test
        # -Wa surfaces deprecation warnings from Django and the standard library.
        run: |
          uv run --no-sync python -Wa -m coverage run manage.py test
          uv run --no-sync coverage xml
      - name: codecov-umbrella
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
